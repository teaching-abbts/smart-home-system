ktor:
  application:
    modules:
      - ch.abbts.ApplicationKt.myModule
  deployment:
    port: 8080
    sslPort: 8443
  security:
    ssl:
      keyStore: keystore.jks
      keyAlias: sampleAlias
      keyStorePassword: foobar
      privateKeyPassword: foobar
    oauth:
      keycloak:
        authServerUrl: "http://localhost:8081"
        realm: "smart-home"
        clientId: "smart-home-app"
        clientSecret: "smart-home-client-secret"
        redirectUri: "http://localhost:8080/auth/callback"
        jwksUri: "http://localhost:8081/realms/smart-home/protocol/openid-connect/certs"
        issuer: "http://localhost:8081/realms/smart-home"
